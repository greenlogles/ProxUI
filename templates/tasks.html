{% extends "base.html" %}

{% block title %}Tasks - Proxmox Manager{% endblock %}

{% block content %}
<div x-data="tasksPage()">
    <div class="d-flex align-items-center flex-wrap gap-3 mb-3">
        <div class="me-auto">
            <div class="sec-title">Recent Tasks</div>
            <div class="sec-sub">Proxmox tasks and ProxUI jobs across the cluster</div>
        </div>
        <button class="btn-x" @click="refresh()" :disabled="loading">
            <i class="bi bi-arrow-clockwise" :class="loading && 'spin'"></i> Refresh
        </button>
    </div>

    <div class="card-x">
        <div class="cx-head flex-wrap gap-2">
            <div class="seg">
                <button :class="{on:filter==='all'}" @click="filter='all'">All</button>
                <button :class="{on:filter==='running'}" @click="filter='running'">Running</button>
                <button :class="{on:filter==='ok'}" @click="filter='ok'">Completed</button>
                <button :class="{on:filter==='error'}" @click="filter='error'">Failed</button>
            </div>
            <div class="seg">
                <button :class="{on:source==='all'}" @click="source='all'">All sources</button>
                <button :class="{on:source==='pve'}" @click="source='pve'">Proxmox</button>
                <button :class="{on:source==='proxui'}" @click="source='proxui'">ProxUI</button>
            </div>
            <div class="seg ms-auto">
                <button :class="{on:limit===50}" @click="limit=50; load()">Last 50</button>
                <button :class="{on:limit===100}" @click="limit=100; load()">Last 100</button>
                <button :class="{on:limit===200}" @click="limit=200; load()">Last 200</button>
            </div>
        </div>
        <div class="cx-body flush tbl-scroll">
            <template x-if="loading && allTasks.length === 0">
                <div class="text-center p-4"><div class="spinner-border spinner-border-sm" role="status"></div> Loading tasks...</div>
            </template>
            <template x-if="error">
                <div class="text-danger p-3"><i class="bi bi-exclamation-triangle"></i> <span x-text="error"></span></div>
            </template>
            <template x-if="!loading && filteredTasks.length === 0">
                <div class="empty-hint">
                    <i class="bi bi-info-circle"></i>
                    <span x-text="filter === 'all' && source === 'all' ? 'No tasks found' : 'No tasks match the current filter'"></span>
                </div>
            </template>
            <table class="tbl" x-show="filteredTasks.length > 0">
                <thead><tr><th>Status</th><th>Task</th><th>Node</th><th>User</th><th>Start time</th><th class="num">Duration</th></tr></thead>
                <tbody>
                    <template x-for="task in filteredTasks" :key="task.id">
                        <tr>
                            <td>
                                <span class="pill" :class="statusInfo(task).pill" x-text="statusInfo(task).label"></span>
                            </td>
                            <td>
                                <a class="nm text-reset" :href="detailUrl(task)" x-text="title(task)"></a>
                                <div class="text-faint" style="font-size:11px">
                                    <template x-if="task.source === 'proxui'">
                                        <span>
                                            <span class="pill info" style="font-size:10px;padding:1px 6px">ProxUI</span>
                                            <span x-show="task.children.length" x-text="task.children.length + (task.children.length === 1 ? ' task' : ' tasks')"></span>
                                        </span>
                                    </template>
                                    <template x-if="vmUrl(task)">
                                        <span>
                                            <span x-text="(task.type || '').startsWith('vz') ? 'CT' : 'VM'"></span>
                                            <a :href="vmUrl(task)" x-text="task.vmid"></a>
                                        </span>
                                    </template>
                                    <template x-if="!task.vmid && task.target">
                                        <span x-text="task.target"></span>
                                    </template>
                                </div>
                                <template x-if="task.status === 'running' && task.current_step">
                                    <div style="max-width:420px">
                                        <div class="text-faint mono" style="font-size:11px" x-text="task.current_step"></div>
                                        <div class="progress mt-1" style="height:4px" x-show="task.progress != null">
                                            <div class="progress-bar" :style="'width:' + task.progress + '%'"></div>
                                        </div>
                                    </div>
                                </template>
                            </td>
                            <td class="text-muted-2" x-text="task.node || ''"></td>
                            <td class="text-muted-2 mono" style="font-size:12px" x-text="task.user || (task.source === 'proxui' ? 'ProxUI' : '')"></td>
                            <td class="text-muted-2 mono" style="font-size:12px" x-text="fmtDateTime(task.started_at)"></td>
                            <td class="num mono text-muted-2" x-text="duration(task)"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
  import * as ProxUtils from "{{ url_for('static', filename='js/utils.js') }}";

  function tasksPage() {
    return {
      allTasks: [], _poller: null,
      filter: 'all',
      source: 'all',
      limit: 50,
      loading: true,
      error: '',

      title: ProxUtils.activityTitle,
      detailUrl: ProxUtils.activityUrl,
      vmUrl: ProxUtils.activityVmUrl,
      statusInfo: ProxUtils.activityStatus,
      duration: ProxUtils.activityDuration,
      fmtDateTime: ProxUtils.formatDateTime,

      get filteredTasks() {
        return this.allTasks.filter(task => {
          if (this.source !== 'all' && task.source !== this.source) return false;
          if (this.filter === 'running') return ProxUtils.activityIsActive(task);
          if (this.filter === 'ok') return task.status === 'ok' || task.status === 'warning';
          if (this.filter === 'error') return task.status === 'failed';
          return true;
        });
      },

      async load() {
        this.loading = true;
        try {
          const data = await ProxUtils.apiJson(`/api/activity?limit=${this.limit}`);
          this.allTasks = Array.isArray(data.items) ? data.items : [];
          this.error = data.error || '';
        } catch (e) {
          this.error = 'Error loading tasks: ' + e.message;
        } finally {
          this.loading = false;
        }
      },

      refresh() { this.load(); },

      init() {
        this.load();
        this._poller = ProxUtils.createAdaptivePoller(() => this.load(), 10000);
      },

      destroy() { this._poller?.destroy(); },
    };
  }

  function register() {
    window.Alpine.data('tasksPage', tasksPage);
  }
  if (window.Alpine) register();
  else document.addEventListener('alpine:init', register);
</script>
{% endblock %}
